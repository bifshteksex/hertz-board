name: CD Production

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  release:
    types: [published]

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://hertz.rshang.in

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "===== Starting Production Deployment ====="
            cd /opt/hertz-board

            echo "1. Stashing local changes and pulling latest code..."
            git fetch --all --tags --force
            git stash push -m "Auto-stash before deployment at $(date)" || true
            git checkout -f ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }} || git reset --hard ${{ github.ref_name }}

            echo "2. Creating backup before deployment..."
            make -f Makefile.production prod-backup || echo "Backup failed, continuing anyway"

            echo "3. Building production Docker images..."
            make -f Makefile.production prod-build
            docker-compose -f docker-compose.production.yml --env-file .env.production build frontend

            echo "4. Restarting containers with new images..."
            docker-compose -f docker-compose.production.yml --env-file .env.production up -d --force-recreate --no-deps backend frontend

            echo "5. Restarting nginx to refresh upstream DNS cache..."
            docker-compose -f docker-compose.production.yml --env-file .env.production restart nginx

            echo "6. Waiting for services to be healthy..."
            sleep 20

            echo "7. Checking deployment status..."
            docker-compose -f docker-compose.production.yml ps

            echo "8. Cleaning up old Docker images..."
            docker image prune -f

            echo "===== Deployment Completed Successfully ====="
            echo "Tag: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            echo "Running health checks..."
            cd /opt/hertz-board

            # Check if containers are running
            if [ $(docker ps | grep hertz-board | wc -l) -lt 5 ]; then
              echo "ERROR: Not all containers are running!"
              docker-compose -f docker-compose.production.yml ps
              exit 1
            fi

            # Check backend health
            sleep 5
            BACKEND_HEALTH=$(docker-compose -f docker-compose.production.yml exec -T backend wget -q -O- http://localhost:8080/health || echo "failed")
            if [ "$BACKEND_HEALTH" = "failed" ]; then
              echo "WARNING: Backend health check failed"
            else
              echo "Backend health check: OK"
            fi

            echo "Health checks completed"

      - name: Create GitHub Release
        if: github.event_name == 'push' # Only create release if triggered by tag push, not manual release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Production Deployment

            Deployed to production server at: ${{ github.event.head_commit.timestamp }}

            ### Changes
            ${{ github.event.head_commit.message }}

            ### Deployment Details
            - Tag: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Environment: Production
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}

      - name: Notify on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            echo "DEPLOYMENT FAILED - Rolling back..."
            cd /opt/hertz-board

            # Show logs for debugging
            docker-compose -f docker-compose.production.yml logs --tail=50

            echo "Check the logs above for error details"
