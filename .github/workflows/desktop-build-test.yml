name: Desktop Build Test

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/desktop-build-test.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: ./frontend
        run: pnpm run test:unit

      - name: Check frontend
        working-directory: ./frontend
        run: pnpm run check

      - name: Lint frontend (Unix only)
        if: matrix.platform != 'windows-latest'
        working-directory: ./frontend
        run: pnpm run lint

      - name: Lint frontend (Windows - ESLint only)
        if: matrix.platform == 'windows-latest'
        working-directory: ./frontend
        run: pnpm exec eslint .

      - name: Build Tauri app (debug)
        working-directory: ./frontend
        run: pnpm run tauri:build:debug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hertzboard-${{ matrix.platform }}-debug
          path: |
            frontend/src-tauri/target/debug/bundle/
          retention-days: 7
